<!DOCTYPE html>
<html>
<body>
  <button onclick="test()">TEST</button>
  <div id="result"></div>
  
  <script>
    async function test() {
      const url = 'https://script.google.com/macros/s/AKfycbwHiYyupoPBZ5nroqcCc9Thp7h8iLbwh6f1q8eQL9LAmAYGHF9w-KKeb75BZVaSvc7lDg/exec';
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({action: 'subscribe', email: 'test@test.com', name: 'Test'})
        });
        
        document.getElementById('result').innerHTML = 'Request sent! Check Google Sheets.';
        console.log('Sent!');
      } catch (e) {
        document.getElementById('result').innerHTML = 'Error: ' + e;
        console.log('Error:', e);
      }
    }
  </script>
</body>
</html>
